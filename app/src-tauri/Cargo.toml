[package]
name = "henrys-looper-app"
version = "0.1.0"
edition = "2024"
description = "Live-Looper - Desktop-Oberflaeche fuer die Rust-Engine"

[[bin]]
name = "henrys-looper"
path = "src/main.rs"

[features]
# ASIO backend, passed straight through to the engine and to cpal. Both have to agree, otherwise
# the two crates would end up with different cpal builds.
asio = ["looper-engine/asio", "cpal/asio"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
looper-engine = { path = "../../engine" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Not a new dependency of the project: the engine already builds on cpal and rtrb, and the app
# needs to name `cpal::Stream` (it owns two of them) and the input FIFO type.
cpal = "0.18"
rtrb = "0.4.0"
tauri-plugin-dialog = "2"

[dev-dependencies]
# Only for the CoreMIDI test in `midi/tests.rs`, which plays a controller through a virtual port.
# The engine already depends on it; this names it for the test.
midir = "0.11.0"

# Only for `dev_snapshot` (devshot.rs): WebKit's own snapshot of the page. Already in the build
# through Tauri's WebView layer; named here to switch on the few classes it needs.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSError", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
