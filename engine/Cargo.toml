[package]
name = "looper-engine"
version = "0.1.0"
edition = "2024"

[features]
# ASIO backend. Needs LLVM/bindgen and the Steinberg ASIO SDK at build time:
#   cargo build --release --features asio
asio = ["cpal/asio"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
cpal = "0.18"
rtrb = "0.4.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = true
