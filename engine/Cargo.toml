[package]
name = "looper-engine"
version = "0.1.0"
edition = "2024"

# The crate is a library first: the desktop app under `app/src-tauri` builds on the same modules
# the CLI uses, so there is exactly one loop core and one set of tests behind it.
[lib]
name = "looper_engine"
path = "src/lib.rs"

# The measuring tool. Unchanged in behaviour - every subcommand still works exactly as before.
[[bin]]
name = "looper-engine"
path = "src/main.rs"

[features]
# ASIO backend. Needs LLVM/bindgen and the Steinberg ASIO SDK at build time:
#   cargo build --release --features asio
asio = ["cpal/asio"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
cpal = "0.18"
# MIDI input (`src/midi/`). The only new dependency of phase 5, and a small one: on Windows it is
# a thin wrapper around winmm's `midiInOpen` - which is also where the exclusive-access failure
# (MMSYSERR_ALLOCATED) comes from that we have to explain rather than swallow. Everything above the
# byte stream is our own, so the whole mapping layer is provable without a controller on the desk.
midir = "0.11.0"
rtrb = "0.4.0"
# The score compiler (`src/score/`). Three small, control-thread-only additions:
#   * `saphyr-parser` - YAML 1.2 event parser. Chosen over serde_yaml/serde_yml (both deprecated)
#     because it hands out a `Span` with 1-based line and column for *every* token, which is what
#     the error messages are built on. Two tiny dependencies of its own (arraydeque, thiserror).
#   * `strsim` - "meintest du 'bass'?" suggestions.
#   * `serde` - the compiled score is a serialisable contract towards the UI.
saphyr-parser = "0.0.12"
serde = { version = "1", features = ["derive"] }
strsim = "0.11.1"

[dev-dependencies]
# Only to prove in a test that the compiled score serialises to the documented JSON shape.
serde_json = "1"
