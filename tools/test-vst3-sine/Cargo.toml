[package]
name = "test-vst3-sine"
version = "0.1.0"
edition = "2024"
publish = false
description = "A minimal VST3 instrument for the host tests: eight sine voices, sustain over IMidiMapping, state, an optional latency."

# Built as a plain dynamic library; the engine's VST3 tests wrap it into a `.vst3` bundle in a
# temporary folder (`engine/src/plugin/tests.rs`), so nothing has to be installed anywhere.
[lib]
crate-type = ["cdylib"]

[dependencies]
vst3 = "0.3.0"
